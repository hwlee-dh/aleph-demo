<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALEPH</title>
<link rel="stylesheet" href="assets/site.css">
<style>
  body {
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
  }
  main {
    width: min(calc(100% - 40px), 600px);
    padding: 48px 0;
    text-align: center;
    word-break: keep-all;
  }
  header { margin-bottom: clamp(32px, 6vh, 56px); }
  header p {
    margin: 18px 0 0;
    color: #abb0b8;
    font-size: clamp(15px, 2.5vw, 19px);
    line-height: 1.6;
  }
  h1 {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(12px, 2vw, 18px);
    margin: 0;
    font-size: clamp(42px, 6vw, 56px);
    font-weight: 800;
    letter-spacing: .05em;
    line-height: 1;
  }
  h1 img { width: clamp(48px, 7vw, 64px); filter: brightness(0) invert(1); }
  nav { border-top: 1px solid var(--fg); }
  nav a {
    display: block;
    padding: 18px 12px;
    border-bottom: 1px solid var(--faint);
    font-size: clamp(19px, 3vw, 24px);
    font-weight: 600;
    line-height: 1.4;
    text-decoration: none;
  }
  nav a:hover, nav a:focus-visible { color: var(--blue); }
  nav a:focus-visible { outline: 2px solid currentColor; outline-offset: -2px; }
</style>
</head>
<body>
<main>
  <header>
    <h1><img src="assets/aleph.png" alt="">ALEPH</h1>
    <p>LLM 에이전트 기반 서사 창작 도구</p>
  </header>
  <nav aria-label="프로젝트 자료">
    <a href="slides/">발표 자료</a>
    <a href="https://hwlee-dh.github.io/aleph-demo-page/">데모</a>
    <a href="https://github.com/hwlee-dh/aleph">프로젝트 GitHub</a>
    <a href="aleph-paper.pdf">최종 보고서 (PDF)</a>
  </nav>
</main>
</body>
</html>
